services:
  api:
    build:
      context: ./backend
    container_name: talkaton-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Файл базы живёт в томе: пересборка образа не стирает наработанные встречи.
      ConnectionStrings__Sqlite: "Data Source=/data/talkaton.db"
      # Фронт в compose ходит через nginx, но оставляем CORS для случая «ng serve + api из compose».
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:8080"
    ports:
      - "5080:8080"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
    container_name: talkaton-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite-data:
