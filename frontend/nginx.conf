server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Браузерные границы для SPA. Inline-стили нужны только для безопасных Angular style-bindings
    # (цвет календаря и геометрия карточек); скрипты остаются строго с нашего origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Ангулярный роутинг: любой неизвестный путь отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # В docker-compose роль proxy.conf.json из `ng serve` играет этот блок.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
