<div class="toolbar">
  <button type="button" class="toolbar__today" title="Сегодня · T" (click)="todayRequested.emit()">Сегодня</button>

  <div class="toolbar__nav">
    <button type="button" aria-label="Назад" title="Назад · ←" (click)="stepped.emit(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <button type="button" aria-label="Вперёд" title="Вперёд · →" (click)="stepped.emit(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>

  <h1 class="toolbar__title">
    {{ title() }}
    @if (loading()) {
      <span class="toolbar__spinner" aria-label="Загружаем встречи"></span>
    }
  </h1>

  <div class="toolbar__spacer"></div>

  <div
    class="toolbar__search"
    [class.toolbar__search--expanded]="searchOpen() || !!search()"
  >
    <button
      type="button"
      class="toolbar__search-btn"
      title="Поиск"
      aria-label="Поиск"
      (click)="toggleSearch()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4-4" />
      </svg>
    </button>
    <input
      #searchInput
      type="search"
      name="search"
      placeholder="Поиск по темам"
      [ngModel]="search()"
      (ngModelChange)="searchChanged.emit($event)"
      (blur)="onSearchBlur()"
      (keydown.escape)="closeSearch()"
    />
  </div>

  <div class="toolbar__views" role="group" aria-label="Вид календаря">
    @for (option of views; track option.value) {
      <button
        type="button"
        class="toolbar__view"
        [class.toolbar__view--active]="option.value === view()"
        [attr.aria-pressed]="option.value === view()"
        [title]="option.label + ' · ' + option.shortcut"
        (click)="viewChanged.emit(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>
