<header class="header">
  <span class="header__brand">Контур Толк</span>

  <nav class="header__tabs">
    @for (tab of tabs; track tab.label) {
      <button type="button" class="tab" [class.tab--active]="tab.active" [disabled]="!tab.active">
        <span class="tab__icon" aria-hidden="true">{{ tab.icon }}</span>
        <span>{{ tab.label }}</span>
        @if (tab.badge) {
          <span class="tab__badge">{{ tab.badge }}</span>
        }
      </button>
    }
  </nav>

  <div class="header__right">
    @if (canAskForNotifications()) {
      <button
        type="button"
        class="header__ghost"
        title="Разрешить браузеру показывать напоминания о встречах"
        (click)="enableNotifications()"
      >
        <span aria-hidden="true">🔔</span>
        Включить напоминания
      </button>
    }

    <button type="button" class="header__ghost">
      <span aria-hidden="true">📹</span>
      Созвониться сейчас
    </button>

    @if (user(); as person) {
      <button
        type="button"
        class="header__user"
        [title]="person.displayName + ' — выйти'"
        (click)="signOut()"
      >
        <span class="header__avatar" [style.background]="'var(--tk-avatar-' + person.avatarColorIndex + ')'">
          {{ initials() }}
        </span>
        {{ person.displayName }}
      </button>
    }
  </div>
</header>
