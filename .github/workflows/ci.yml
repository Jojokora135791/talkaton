name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/Talkaton.sln

      - name: Build
        run: dotnet build backend/Talkaton.sln -c Release --no-restore

      - name: Test
        run: dotnet test backend/Talkaton.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Проверить, что модель и миграции не разъехались
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.10
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/Talkaton.Infrastructure \
            --startup-project backend/src/Talkaton.Infrastructure

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Фронтенд — линт, тесты и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build -- --configuration production

  compose:
    name: Docker Compose поднимается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: docker compose up
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Приёмка — стенд отвечает
        run: |
          curl --fail --silent --show-error http://localhost:5080/health
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/

      - name: Приёмка этапа 2 — вход по имени и демо-неделя
        run: .github/scripts/smoke-stage-2.sh

      - name: Логи при падении
        if: failure()
        run: docker compose logs --no-color

      - name: Остановить
        if: always()
        run: docker compose down -v

  deploy:
    name: Выкатить на стенд
    # Гейт: на стенд едет только то, что прошло все три проверки выше.
    needs: [backend, frontend, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Две выкатки разом затопчут друг друга на одном docker compose.
    concurrency:
      group: deploy-stand
      cancel-in-progress: false
    environment:
      name: production
      url: https://talkaton.duckdns.org
    steps:
      - name: Ключ и отпечаток хоста
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Что запускать, решает сервер: ключ ограничен принудительной командой
      # в authorized_keys, отдельной оболочки у него нет.
      - name: Выкатка
        run: ssh -o BatchMode=yes -p 44 -i ~/.ssh/deploy_key deploy@talkaton.duckdns.org

      - name: Стенд отвечает
        run: curl --fail --silent --show-error https://talkaton.duckdns.org/api/health
